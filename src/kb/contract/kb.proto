// kb contract. Regenerate with `make contract`. Versioned by kb's release tag (adrs/0018).
//
// Artifact content crosses as canonical YAML text beside the fixed
// identity fields, since content shape is schema-defined at runtime.
// A change's response is its result or a refusal holding every fault,
// never both; a refusal means nothing was written. The other responses
// carry their faults beside what they give, and a response that carries
// faults is a refusal.
syntax = "proto3";

package kb.v1;


service Kb {
  rpc Init(InitRequest) returns (InitResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Replace(ReplaceRequest) returns (ReplaceResponse);
  rpc Journal(JournalRequest) returns (JournalResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Refs(RefsRequest) returns (RefsResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc Add(AddRequest) returns (AddResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc CreateMany(CreateManyRequest) returns (CreateManyResponse);
  rpc ReplaceMany(ReplaceManyRequest) returns (ReplaceManyResponse);
  rpc AddMany(AddManyRequest) returns (AddManyResponse);
  rpc RemoveMany(RemoveManyRequest) returns (RemoveManyResponse);
}

// Who made an entry in the history: the role, and the piece of work.
message Actor {
  string role = 1;
  string execution = 2;
}

// Who makes a change and why: the role, the piece of work, and the message.
message Signature {
  string role = 1;
  string execution = 2;
  string message = 3;
}

// An artifact root when place is empty; a node inside it otherwise.
message Locator {
  string id = 1;
  string place = 2;
}

message Fault {
  string artifact = 1;
  string place = 2;
  string rule = 3;
  string message = 4;
}

// Every fault a call was refused for; nothing was written.
message Refusal {
  repeated Fault faults = 1;
}

message InitRequest {
  string root = 1;
  Actor actor = 2;
}

// With faults, a refusal: no role.
message InitResponse {
  repeated Fault faults = 1;
}

// A new artifact of a kind. The title travels here, never inside the
// content.
message CreateRequest {
  string kind = 1;
  string title = 2;
  string content = 3;  // canonical YAML: fields, sections, parts
  Signature signature = 4;
}

// The name kb gave the artifact, and its version.
message Created {
  string id = 1;
  int32 revision = 2;
}

message CreateResponse {
  oneof outcome {
    Created result = 1;
    Refusal refusal = 2;
  }
}

// A summary by default. A whole read gives the artifact's content with
// each link followed as many steps as depth says, the target in place of
// its name; a target already filled in on the way is left as its name.
// A section read gives the section with the title named, and nothing else.
message ReadRequest {
  enum Level {
    SUMMARY = 0;
    WHOLE = 1;
    SECTION = 2;
  }
  Locator locator = 1;
  Level level = 2;
  int32 depth = 3;
  string section = 4;
}

// A summary: identity, the fields the type shows at a glance, a stub of
// each reference target and of each part, and inbound counts. With faults,
// a refusal: a bad locator, a name the store lacks, or no store found.
message ReadResponse {
  string id = 1;
  string type = 2;
  int32 schema_version = 3;
  int32 revision = 4;
  string title = 5;
  string content = 6;  // canonical YAML
  repeated Stub references = 7;
  repeated PartStub parts = 8;
  repeated InboundCount inbound = 9;
  repeated Fault faults = 10;
}

message Stub {
  string field = 1;
  string id = 2;
  string kind = 3;
  string title = 4;
  string fields = 5;   // canonical YAML
}

message PartStub {
  string collection = 1;
  string id = 2;
  string title = 3;
}

message InboundCount {
  string kind = 1;
  string field = 2;
  int32 count = 3;
}

message ValidateRequest {
}

// Every violation the store holds, each a fault naming the artifact, the
// place and the rule; a stored file that cannot be read is one of them.
// Every artifact last checked against an older version of its type is
// listed as stale, whether or not it still fits. With faults, a refusal:
// no store found.
message ValidateResponse {
  repeated Fault violations = 1;
  repeated Fault faults = 2;
  repeated Stale stale = 3;
}

// An artifact behind its type: the version it was last checked against,
// and the type's version now.
message Stale {
  string artifact = 1;
  int32 schema_version = 2;
  int32 current = 3;
}

// A new content for an artifact the store holds, or for the node at the
// locator's place inside it; its title is kept.
message ReplaceRequest {
  Locator locator = 1;
  string content = 2;  // canonical YAML: fields, sections, parts
  Signature signature = 3;
}

// The artifact replaced, and its version now.
message Replaced {
  int32 revision = 1;
  string id = 2;
}

message ReplaceResponse {
  oneof outcome {
    Replaced result = 1;
    Refusal refusal = 2;
  }
}

// Narrows the journal to the entries about one artifact, made under one
// role, for one piece of work, at or after a time (ISO 8601, a date alone
// meaning its midnight, UTC unless it says otherwise), or landed in one
// set, named by the batch a *Many gave, by each one given; with none, every
// entry.
message JournalRequest {
  string artifact = 1;
  string role = 2;
  string execution = 3;
  string since = 4;
  string batch = 5;
}

// One journal entry, as the store holds it. `at` is ISO 8601 in UTC; a
// change made alone names itself as its batch. A snapshot's entry has op
// `snapshot`, lists what was read, and names no artifact of its own.
message Entry {
  string id = 1;
  string at = 2;
  Actor actor = 3;
  string op = 4;
  string artifact = 5;
  string place = 6;
  int32 revision = 7;
  int32 schema_version = 8;
  string digest = 9;
  string message = 10;
  string batch = 11;
  repeated Snapshotted read = 12;
}

// An artifact a piece of work read: the version read and the fingerprint
// of the file the store held at that version.
message Snapshotted {
  string artifact = 1;
  int32 revision = 2;
  string digest = 3;
}

// The entries, oldest first. With faults, a refusal: a name that is not a
// plain name, a time that cannot be read, or no store found.
message JournalResponse {
  repeated Entry entries = 1;
  repeated Fault faults = 2;
}

// The words to look for in the prose, the fields, or both, among the
// artifacts of one kind when a type is given.
message SearchRequest {
  enum Scope {
    SECTIONS = 0;
    FIELDS = 1;
    ALL = 2;
  }
  string text = 1;
  string type = 2;
  Scope scope = 3;
}

// A section or a field that holds a word searched for: a stub of its
// artifact, the section's title or the field's name, and the words around
// the first match.
message Match {
  Stub stub = 1;
  string section = 2;
  string snippet = 3;
  string field = 4;
}

// The matches, the one holding the words most often first. With faults, a
// refusal: a type that is not a plain name, or no store found.
message SearchResponse {
  repeated Match matches = 1;
  repeated Fault faults = 2;
}

// The links out of an artifact, or into it, followed as many steps as
// depth says. A via names the one field a link may be; a type, the one
// kind an artifact reached may be. Either narrows every step.
message RefsRequest {
  enum Direction {
    OUT = 0;
    IN = 1;
  }
  Locator locator = 1;
  int32 depth = 2;
  Direction direction = 3;
  string via = 4;
  string type = 5;
}

// One step of a route: the link taken and the name it landed on. Going
// in, the link is the field of the artifact landed on that points back.
message Hop {
  string field = 1;
  string id = 2;
}

// An artifact the links reach, with the route taken to it from the one
// asked about; its stub's field is the link of the last step.
message Reached {
  Stub stub = 1;
  repeated Hop route = 2;
}

// Each artifact reached once, by the shortest route, nearest first. With
// faults, a refusal: a bad locator, a name the store lacks, a type that is
// not a plain name, or no store found.
message RefsResponse {
  repeated Reached reached = 1;
  repeated Fault faults = 2;
}

// The artifacts of one kind, narrowed to those whose fields hold the
// values given, each value compared as the text it is written as. As
// stubs by default, or as names only.
message ListRequest {
  enum Form {
    STUBS = 0;
    IDS = 1;
  }
  string type = 1;
  map<string, string> fields = 2;
  Form form = 3;
}

// The matches in the order the store holds them, as stubs or as names.
// With faults, a refusal: a kind that is not a plain name, or no store
// found.
message ListResponse {
  repeated Stub stubs = 1;
  repeated string ids = 2;
  repeated Fault faults = 3;
}

// What a piece of work read, as the store holds it now: the actor names
// the role and the piece of work, the message says why.
message SnapshotRequest {
  Actor actor = 1;
  repeated string artifacts = 2;
  string message = 3;
}

// The name of the journal entry that records the snapshot. With faults, a
// refusal: a name that is not a plain name, a name the store lacks, or no
// store found, and nothing was written.
message SnapshotResponse {
  string entry = 1;
  repeated Fault faults = 2;
}

// One item added at the end of a collection inside an artifact the store
// holds: the locator's place is the collection's name, and kb names the
// item.
message AddRequest {
  Locator locator = 1;
  string content = 2;  // canonical YAML: the item's fields, never its id
  Signature signature = 3;
}

// The name kb gave the item, and the artifact's version now.
message Added {
  string id = 1;
  int32 revision = 2;
}

message AddResponse {
  oneof outcome {
    Added result = 1;
    Refusal refusal = 2;
  }
}

// A whole artifact the store holds, taken out, as long as nothing points
// at it.
message RemoveRequest {
  Locator locator = 1;
  Signature signature = 2;
}

// The artifact removed, and the version the removal left behind.
message Removed {
  int32 revision = 1;
  string id = 2;
}

// A refusal: a bad locator, a name the store lacks, or, one fault each,
// every link that points at the artifact, naming the artifact that holds
// it and its place there.
message RemoveResponse {
  oneof outcome {
    Removed result = 1;
    Refusal refusal = 2;
  }
}

// A set of creates, landing in order as one change, or none does. A
// create may carry a key of the client's choosing, unique in the set; a
// link written `@` and the key, anywhere in the set, names the artifact
// that create makes, and kb puts the name it gives that artifact in its
// place before anything is checked. A key names a whole artifact, never
// a place inside one.
message CreateItem {
  string kind = 1;
  string title = 2;
  string content = 3;  // canonical YAML: fields, sections, parts
  string key = 4;
}

message CreateManyRequest {
  repeated CreateItem items = 1;
  Signature signature = 2;
}

// The set's name, minted by kb, and each create's result in the order of
// the set.
message CreatedMany {
  string batch = 1;
  repeated Created results = 2;
}

message CreateManyResponse {
  oneof outcome {
    CreatedMany result = 1;
    Refusal refusal = 2;
  }
}

// A set of replacements, landing in order as one change, or none does.
message ReplaceItem {
  Locator locator = 1;
  string content = 2;  // canonical YAML: fields, sections, parts
}

message ReplaceManyRequest {
  repeated ReplaceItem items = 1;
  Signature signature = 2;
}

// The set's name, minted by kb, and each replacement's result, naming the
// artifact it replaced, in the order of the set.
message ReplacedMany {
  string batch = 1;
  repeated Replaced results = 2;
}

message ReplaceManyResponse {
  oneof outcome {
    ReplacedMany result = 1;
    Refusal refusal = 2;
  }
}

// A set of items added, landing in order as one change, or none does.
message AddItem {
  Locator locator = 1;
  string content = 2;  // canonical YAML: the item's fields, never its id
}

message AddManyRequest {
  repeated AddItem items = 1;
  Signature signature = 2;
}

// The set's name, minted by kb, and each addition's result, in the order
// of the set.
message AddedMany {
  string batch = 1;
  repeated Added results = 2;
}

message AddManyResponse {
  oneof outcome {
    AddedMany result = 1;
    Refusal refusal = 2;
  }
}

// A set of removals, landing in order as one change, or none does.
message RemoveItem {
  Locator locator = 1;
}

message RemoveManyRequest {
  repeated RemoveItem items = 1;
  Signature signature = 2;
}

// The set's name, minted by kb, and each removal's result, naming the
// artifact it removed, in the order of the set.
message RemovedMany {
  string batch = 1;
  repeated Removed results = 2;
}

message RemoveManyResponse {
  oneof outcome {
    RemovedMany result = 1;
    Refusal refusal = 2;
  }
}
